<!DOCTYPE html>
<html>
<head>
    <title>Book Appointment - Dunbar Vet Clinic</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <h1>Book Appointment</h1>
    {% if error %}<p class="error">{{ error }}</p>{% endif %}
    <form method="post">
        <p>
            <label>Animal:</label>
            <select name="animal_id">
                {% for a in animals %}
                <option value="{{ a.id }}">{{ a.name }} ({{ a.client_name }})</option>
                {% endfor %}
            </select>
        </p>
        <p><label>Time: <input type="datetime-local" name="appointment_time"></label></p>
        <p><label>Duration (minutes): <input type="number" name="duration_minutes" value="30"></label></p>
        <p>
            <label>Visit type:</label>
            <select name="visit_type">
                <option value="clinic">Clinic consultation</option>
                <option value="farm_visit">Farm visit</option>
            </select>
        </p>
        <p><label>Room (clinic only): <input name="room" placeholder="R1 / R2"></label></p>
        <p><button type="submit">Book</button></p>
    </form>
    <p><a href="{{ url_for('list_appointments') }}">Back to appointments</a></p>
</body>
</html>
