<!DOCTYPE html>
<html>
<head>
    <title>Properties - Dunbar Vet Clinic</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <h1>Properties</h1>
    <p><a href="{{ url_for('new_property') }}">Add property</a> | <a href="{{ url_for('index') }}">Home</a></p>
    <table>
        <tr><th>ID</th><th>Address</th><th>Type</th><th>Owner</th></tr>
        {% for p in properties %}
        <tr>
            <td>{{ p.id }}</td>
            <td>{{ p.address }}</td>
            <td>{{ p.property_type or '' }}</td>
            <td>{{ p.client_name }}</td>
        </tr>
        {% endfor %}
    </table>
</body>
</html>
