<!DOCTYPE html>
<html>
<head>
    <title>New Property - Dunbar Vet Clinic</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <h1>Add Property</h1>
    {% if error %}<p class="error">{{ error }}</p>{% endif %}
    <form method="post">
        <p>
            <label>Owner:</label>
            <select name="client_id">
                {% for c in clients %}
                <option value="{{ c.id }}">{{ c.name }}</option>
                {% endfor %}
            </select>
        </p>
        <p><label>Address: <input name="address"></label></p>
        <p><label>Type: <input name="property_type" placeholder="house / farm / flat"></label></p>
        <p><button type="submit">Save</button></p>
    </form>
    <p><a href="{{ url_for('list_properties') }}">Back to properties</a></p>
</body>
</html>
