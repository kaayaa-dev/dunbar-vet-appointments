<!DOCTYPE html>
<html>
<head><title>Clients - Dunbar Vet</title></head>
<body>
  <h1>Clients</h1>
  <p><a href="/">Home</a> | <a href="/clients/new">Add New Client</a></p>

  <form method="get" action="/clients">
    <input type="text" name="q" value="{{ keyword }}" placeholder="Search by name">
    <button type="submit">Search</button>
  </form>

  <table border="1" cellpadding="6">
    <tr>
      <th>ID</th><th>Name</th><th>Phone</th><th>Email</th><th>Created</th>
    </tr>
    {% for c in clients %}
    <tr>
      <td>{{ c.id }}</td>
      <td>{{ c.name }}</td>
      <td>{{ c.phone }}</td>
      <td>{{ c.email }}</td>
      <td>{{ c.created_at }}</td>
    </tr>
    {% else %}
    <tr><td colspan="5">No clients yet.</td></tr>
    {% endfor %}
  </table>
</body>
</html>
